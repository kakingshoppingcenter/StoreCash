name: Deploy Supabase Database Migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_DATABASE to continue'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-database-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Push production migrations
    if: ${{ inputs.confirmation == 'DEPLOY_DATABASE' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: cdmghdexjcqcmrwnbglw

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN."
            missing=1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_DB_PASSWORD."
            missing=1
          fi
          exit "${missing}"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        shell: bash
        run: |
          supabase link \
            --project-ref "${SUPABASE_PROJECT_ID}" \
            --password "${SUPABASE_DB_PASSWORD}"

      - name: Preview pending migrations
        shell: bash
        run: supabase db push --linked --dry-run

      - name: Apply pending migrations
        shell: bash
        run: supabase db push --linked
