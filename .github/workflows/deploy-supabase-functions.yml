name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy admin-users
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: cdmghdexjcqcmrwnbglw

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Supabase deployment was skipped because SUPABASE_ACCESS_TOKEN is not configured."
          else
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Explain skipped deployment
        if: ${{ steps.credentials.outputs.ready != 'true' }}
        shell: bash
        run: |
          {
            echo '## Supabase deployment skipped'
            echo
            echo 'Add the encrypted repository secret `SUPABASE_ACCESS_TOKEN`, then run this workflow again.'
            echo 'No application or database data was changed.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install Supabase CLI
        if: ${{ steps.credentials.outputs.ready == 'true' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase configuration
        if: ${{ steps.credentials.outputs.ready == 'true' }}
        shell: bash
        run: |
          test -f supabase/config.toml
          test -f supabase/functions/admin-users/index.ts
          supabase --version

      - name: Deploy admin-users Edge Function
        if: ${{ steps.credentials.outputs.ready == 'true' }}
        shell: bash
        run: |
          supabase functions deploy admin-users \
            --project-ref "${SUPABASE_PROJECT_ID}" \
            --use-api

      - name: Confirm deployed functions
        if: ${{ steps.credentials.outputs.ready == 'true' }}
        shell: bash
        run: supabase functions list --project-ref "${SUPABASE_PROJECT_ID}"
