name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy admin-users
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: cdmghdexjcqcmrwnbglw

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate required secret
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase configuration
        shell: bash
        run: |
          test -f supabase/config.toml
          test -f supabase/functions/admin-users/index.ts
          supabase --version

      - name: Deploy admin-users Edge Function
        shell: bash
        run: |
          supabase functions deploy admin-users \
            --project-ref "${SUPABASE_PROJECT_ID}" \
            --use-api

      - name: Confirm deployed functions
        shell: bash
        run: supabase functions list --project-ref "${SUPABASE_PROJECT_ID}"
