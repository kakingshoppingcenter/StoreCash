name: Validate StoreCash

on:
  pull_request:
  push:
    branches:
      - main
      - feat/deposit-checker-scope

permissions:
  contents: read

jobs:
  web-syntax:
    name: Web script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          find . -maxdepth 1 -type f -name '*.js' -print0 \
            | sort -z \
            | xargs -0 -n1 node --check

  edge-function-check:
    name: Supabase Edge Function check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Functions
        run: |
          deno check supabase/functions/admin-users/index.ts
          deno check supabase/functions/admin-delete-user/index.ts
          deno check supabase/functions/admin-reset-data/index.ts
          deno check supabase/functions/admin-sample-data/index.ts
